<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lukujono</title>
<link rel="stylesheet" href="hub.css">
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a class="btn-back" href="index.html">&#8592; Takaisin</a>
    <div class="stars"><span id="starCount">0</span> <span class="s">&#9733;</span></div>
  </div>

  <div class="card">
    <p style="font-size:26px;color:#7a7a8c;margin:0 0 6px 0;">Mik&auml; luku puuttuu?</p>
    <div id="show" class="question" style="margin:10px 0;"></div>
  </div>

  <div class="answers" id="answers"></div>
  <div id="feedback" class="feedback">&nbsp;</div>
</div>

<script src="logic.js"></script>
<script src="celebrate.js"></script>
<script type="text/javascript">
(function () {
  "use strict";
  var stars = 0, locked = false, answer = 0;
  try { var sv = window.localStorage.getItem("hub_stars"); if (sv) { stars = parseInt(sv,10)||0; } } catch (e) {}

  var el = {
    show: document.getElementById("show"),
    ans: document.getElementById("answers"),
    fb: document.getElementById("feedback"),
    star: document.getElementById("starCount")
  };
  el.star.innerHTML = String(stars);

  function newQuestion(){
    locked = false;
    el.fb.className = "feedback"; el.fb.innerHTML = "&nbsp;";
    var q = window.Hub.sequence.make();
    answer = q.answer;
    el.show.innerHTML = q.text;
    el.ans.innerHTML = "";
    for (var m=0;m<q.options.length;m++){
      var b = document.createElement("button");
      b.className = "answer";
      b.innerHTML = String(q.options[m]);
      b.setAttribute("data-v", String(q.options[m]));
      b.onclick = onAnswer;
      el.ans.appendChild(b);
    }
  }

  function onAnswer(){
    if (locked) return;
    if (parseInt(this.getAttribute("data-v"),10) === answer){
      locked = true;
      this.className = "answer good";
      el.fb.className = "feedback ok"; el.fb.innerHTML = "Oikein! &#9733;";
      stars++; el.star.innerHTML = String(stars);
      try { window.localStorage.setItem("hub_stars", String(stars)); } catch(e){}
      try { if (window.celebrate) window.celebrate(); } catch(e){}
      setTimeout(newQuestion, 1300);
    } else {
      this.className = "answer bad";
      el.fb.className = "feedback no"; el.fb.innerHTML = "Yritä uudelleen";
    }
  }

  newQuestion();
  setTimeout(function(){ window.scrollTo(0,1); }, 200);
})();
</script>
</body>
</html>
