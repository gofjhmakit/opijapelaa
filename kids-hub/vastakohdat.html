<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Vastakohdat</title>
<link rel="stylesheet" href="hub.css">
  <script src="ui.js"></script>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a class="btn-back" href="index.html">&#8592; Takaisin</a>
    <div class="stars"><span id="starCount">0</span> <span class="s">&#9733;</span></div>
  </div>

  <div class="card">
    <p style="font-size:26px;color:#7a7a8c;margin:0 0 6px 0;">Mik&auml; on vastakohta?</p>
    <div id="word" class="word">iso</div>
  </div>

  <div class="answers" id="answers"></div>
  <div id="feedback" class="feedback">&nbsp;</div>
  <p class="hint">Valitse oikea vastakohta.</p>
</div>

<script src="logic.js"></script>
<script src="celebrate.js"></script>
<script type="text/javascript">
(function () {
  "use strict";

  var PAIRS = [
    ["iso","pieni"],["kuuma","kylmä"],["ylös","alas"],["nopea","hidas"],
    ["valoisa","pimeä"],["märkä","kuiva"],["uusi","vanha"],["auki","kiinni"],
    ["iloinen","surullinen"],["täysi","tyhjä"],["korkea","matala"],["vahva","heikko"],
    ["pitkä","lyhyt"],["kova","pehmeä"],["likainen","puhdas"],["raskas","kevyt"],
    ["ylhäällä","alhaalla"],["eteen","taakse"],["avoin","suljettu"],["vasen","oikea"],
    ["päivä","yö"],["alku","loppu"],["ensimmäinen","viimeinen"],["paljon","vähän"]
  ];

  var stars = 0, locked = false, answer = "";
  var lastIdx = -1;
  try { var sv = window.localStorage.getItem("hub_stars"); if (sv) { stars = parseInt(sv,10)||0; } } catch (e) {}

  var el = {
    word: document.getElementById("word"),
    ans: document.getElementById("answers"),
    fb: document.getElementById("feedback"),
    star: document.getElementById("starCount")
  };
  el.star.innerHTML = String(stars);

  function rnd(n){ return Math.floor(Math.random()*n); }

  function allWords(){
    var a = [];
    for (var i=0;i<PAIRS.length;i++){ a.push(PAIRS[i][0]); a.push(PAIRS[i][1]); }
    return a;
  }

  function newQuestion(){
    locked = false;
    el.fb.className = "feedback"; el.fb.innerHTML = "&nbsp;";
    var q = Hub.opposites.make();
    answer = q.answer;
    el.word.innerHTML = q.shown;

    el.ans.innerHTML = "";
    for (var m=0;m<q.options.length;m++){
      var b = document.createElement("button");
      b.className = "answer";
      b.style.width = "auto";
      b.style.minWidth = "150px";
      b.style.padding = "0 24px";
      b.innerHTML = q.options[m];
      b.setAttribute("data-w", q.options[m]);
      b.onclick = onAnswer;
      el.ans.appendChild(b);
    }
  }

  function onAnswer(){
    if (locked) return;
    var w = this.getAttribute("data-w");
    if (w === answer){
      locked = true;
      this.className = "answer good";
      el.fb.className = "feedback ok"; el.fb.innerHTML = "Oikein! &#9733;";
      stars++; el.star.innerHTML = String(stars);
      try { window.localStorage.setItem("hub_stars", String(stars)); } catch(e){}
      try { if (window.celebrate) window.celebrate(); } catch(e){}
      setTimeout(newQuestion, 1300);
    } else {
      this.className = "answer bad";
      el.fb.className = "feedback no"; el.fb.innerHTML = "Yritä uudelleen";
    }
  }

  newQuestion();
  setTimeout(function(){ window.scrollTo(0,1); }, 200);
})();
</script>
</body>
</html>
