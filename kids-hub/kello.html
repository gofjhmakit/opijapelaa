<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kello</title>
<link rel="stylesheet" href="hub.css">
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a class="btn-back" href="index.html">&#8592; Takaisin</a>
    <div class="stars"><span id="starCount">0</span> <span class="s">&#9733;</span></div>
  </div>

  <div class="modes">
    <span class="mode-btn on" id="dEasy">Tasatunnit</span>
    <span class="mode-btn" id="dHard">Puolet ja vartit</span>
  </div>

  <div class="card">
    <div id="clock"></div>
    <p style="font-size:26px;color:#7a7a8c;margin:4px 0 0 0;">Paljonko kello on?</p>
  </div>

  <div class="answers" id="answers"></div>
  <div id="feedback" class="feedback">&nbsp;</div>
</div>

<script src="logic.js"></script>
<script src="celebrate.js"></script>
<script type="text/javascript">
(function () {
  "use strict";

  var hard = false, stars = 0, locked = false, answer = "";
  try { var sv = window.localStorage.getItem("hub_stars"); if (sv) { stars = parseInt(sv,10)||0; } } catch (e) {}

  var el = {
    clock: document.getElementById("clock"),
    ans: document.getElementById("answers"),
    fb: document.getElementById("feedback"),
    star: document.getElementById("starCount"),
    dEasy: document.getElementById("dEasy"),
    dHard: document.getElementById("dHard")
  };
  el.star.innerHTML = String(stars);

  function hand(cx, cy, deg, len){
    var r = deg * Math.PI / 180;
    return { x: cx + len*Math.sin(r), y: cy - len*Math.cos(r) };
  }

  function clockSVG(H, M){
    var cx=100, cy=100;
    var s = '<svg class="pic" viewBox="0 0 200 200" style="width:200px;height:200px;">';
    s += '<circle cx="100" cy="100" r="92" fill="#fff" stroke="#f08c00" stroke-width="5"/>';
    // ticks + numbers
    var i;
    for (i=1;i<=12;i++){
      var a = i*30;
      var p1 = hand(cx,cy,a,92), p2 = hand(cx,cy,a,82);
      s += '<line x1="'+p1.x.toFixed(1)+'" y1="'+p1.y.toFixed(1)+'" x2="'+p2.x.toFixed(1)+'" y2="'+p2.y.toFixed(1)+'" stroke="#f08c00" stroke-width="3"/>';
      var np = hand(cx,cy,a,68);
      s += '<text x="'+np.x.toFixed(1)+'" y="'+(np.y+8).toFixed(1)+'" font-size="22" font-weight="800" fill="#2b2b3a" text-anchor="middle">'+i+'</text>';
    }
    // hands
    var hourDeg = (H%12)*30 + M*0.5;
    var minDeg = M*6;
    var hh = hand(cx,cy,hourDeg,46);
    var mh = hand(cx,cy,minDeg,70);
    s += '<line x1="100" y1="100" x2="'+hh.x.toFixed(1)+'" y2="'+hh.y.toFixed(1)+'" stroke="#1864ab" stroke-width="8" stroke-linecap="round"/>';
    s += '<line x1="100" y1="100" x2="'+mh.x.toFixed(1)+'" y2="'+mh.y.toFixed(1)+'" stroke="#e03131" stroke-width="5" stroke-linecap="round"/>';
    s += '<circle cx="100" cy="100" r="7" fill="#2b2b3a"/>';
    s += '</svg>';
    return s;
  }

  function newQuestion(){
    locked = false;
    el.fb.className="feedback"; el.fb.innerHTML="&nbsp;";
    var q = Hub.clock.make(hard);
    answer = q.answer;
    el.clock.innerHTML = clockSVG(q.H, q.M);

    el.ans.innerHTML="";
    for (var m=0;m<q.options.length;m++){
      var b=document.createElement("button");
      b.className="answer";
      b.style.width="auto"; b.style.minWidth="140px"; b.style.padding="0 20px";
      b.style.fontSize="30px";
      b.innerHTML=q.options[m];
      b.setAttribute("data-t",q.options[m]);
      b.onclick=onAnswer;
      el.ans.appendChild(b);
    }
  }

  function onAnswer(){
    if (locked) return;
    var t=this.getAttribute("data-t");
    if (t===answer){
      locked=true;
      this.className="answer good";
      el.fb.className="feedback ok"; el.fb.innerHTML="Oikein! &#9733;";
      stars++; el.star.innerHTML=String(stars);
      try { window.localStorage.setItem("hub_stars", String(stars)); } catch(e){}
      try { if (window.celebrate) window.celebrate(); } catch(e){}
      setTimeout(newQuestion, 1300);
    } else {
      this.className="answer bad";
      el.fb.className="feedback no"; el.fb.innerHTML="Yritä uudelleen";
    }
  }

  function setDiff(h){
    hard=h;
    el.dEasy.className="mode-btn"+(h?"":" on");
    el.dHard.className="mode-btn"+(h?" on":"");
    newQuestion();
  }
  el.dEasy.onclick=function(){ setDiff(false); };
  el.dHard.onclick=function(){ setDiff(true); };

  newQuestion();
  setTimeout(function(){ window.scrollTo(0,1); }, 200);
})();
</script>
</body>
</html>
