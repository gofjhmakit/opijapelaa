<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Muodot</title>
<link rel="stylesheet" href="hub.css">
  <script src="ui.js"></script>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a class="btn-back" href="index.html">&#8592; Takaisin</a>
    <div class="stars"><span id="starCount">0</span> <span class="s">&#9733;</span></div>
  </div>

  <div class="card">
    <p style="font-size:26px;color:#7a7a8c;margin:0 0 4px 0;">Mik&auml; muoto?</p>
    <div id="shape"></div>
  </div>

  <div class="answers" id="answers"></div>
  <div id="feedback" class="feedback">&nbsp;</div>
</div>

<script src="logic.js"></script>
<script src="celebrate.js"></script>
<script type="text/javascript">
(function () {
  "use strict";

  var F = "#4263eb";
  var SHAPES = [
    {n:"ympyrä",     s:'<circle cx="100" cy="100" r="72" fill="'+F+'"/>'},
    {n:"neliö",      s:'<rect x="32" y="32" width="136" height="136" rx="8" fill="'+F+'"/>'},
    {n:"kolmio",         s:'<polygon points="100,28 172,166 28,166" fill="'+F+'"/>'},
    {n:"suorakulmio",    s:'<rect x="18" y="62" width="164" height="76" rx="8" fill="'+F+'"/>'},
    {n:"tähti",      s:'<polygon points="100,22 122,78 182,78 134,114 152,172 100,136 48,172 66,114 18,78 78,78" fill="'+F+'"/>'},
    {n:"sydän",      s:'<path d="M100 170 C40 122 28 74 58 52 C84 33 100 58 100 72 C100 58 116 33 142 52 C172 74 160 122 100 170 Z" fill="'+F+'"/>'}
  ];
  var SVG = {};
  (function(){ for (var i=0;i<SHAPES.length;i++) SVG[SHAPES[i].n]=SHAPES[i].s; })();

  var stars = 0, locked = false, lastIdx = -1, answer = "";
  try { var sv = window.localStorage.getItem("hub_stars"); if (sv) { stars = parseInt(sv,10)||0; } } catch (e) {}

  var el = {
    shape: document.getElementById("shape"),
    ans: document.getElementById("answers"),
    fb: document.getElementById("feedback"),
    star: document.getElementById("starCount")
  };
  el.star.innerHTML = String(stars);

  function rnd(n){ return Math.floor(Math.random()*n); }

  function newQuestion(){
    locked=false;
    el.fb.className="feedback"; el.fb.innerHTML="&nbsp;";
    var q = Hub.shapes.make();
    answer = q.answer;
    el.shape.innerHTML = '<svg class="pic" viewBox="0 0 200 200" style="width:200px;height:200px;">'+SVG[q.shape]+'</svg>';

    el.ans.innerHTML="";
    for (var m=0;m<q.options.length;m++){
      (function(name){
        var b=document.createElement("button");
        b.className="answer";
        b.style.width="auto"; b.style.minWidth="140px"; b.style.padding="0 20px";
        b.style.fontSize="28px";
        b.innerHTML=name;
        b.setAttribute("data-n", name);
        b.onclick=onAnswer;
        el.ans.appendChild(b);
      })(q.options[m]);
    }
  }

  function onAnswer(){
    if (locked) return;
    if (this.getAttribute("data-n")===answer){
      locked=true;
      this.className="answer good";
      el.fb.className="feedback ok"; el.fb.innerHTML="Oikein! &#9733;";
      stars++; el.star.innerHTML=String(stars);
      try { window.localStorage.setItem("hub_stars", String(stars)); } catch(e){}
      try { if (window.celebrate) window.celebrate(); } catch(e){}
      setTimeout(newQuestion, 1300);
    } else {
      this.className="answer bad";
      el.fb.className="feedback no"; el.fb.innerHTML="Yritä uudelleen";
    }
  }

  newQuestion();
  setTimeout(function(){ window.scrollTo(0,1); }, 200);
})();
</script>
</body>
</html>
